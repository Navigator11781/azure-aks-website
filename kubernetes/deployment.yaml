apiVersion: apps/v1
kind: Deployment

metadata:
  name: azure-aks-website

spec:
  replicas: 2

  selector:
    matchLabels:
      app: azure-aks-website

  template:
    metadata:
      labels:
        app: azure-aks-website

    spec:
      containers:
        - name: website
          image: navigator81/azure-aks-website:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
